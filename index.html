<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30の短篇</title>
<meta name="description" content="30のお題に短篇を当てはめて、一枚の画像にまとめます。入力内容はブラウザの外に送信されません。">
<meta property="og:title" content="30の短篇">
<meta property="og:description" content="30のお題に短篇を当てはめて、一枚の画像にまとめます。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://washutakumi.github.io/30ShortStories/">
<meta property="og:image" content="https://washutakumi.github.io/30ShortStories/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="30の短篇">
<meta name="twitter:description" content="30のお題に短篇を当てはめて、一枚の画像にまとめます。">
<meta name="twitter:image" content="https://washutakumi.github.io/30ShortStories/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f2ea; --card:#fffdf8; --line:#d8cfc0; --ink:#2a2622; --sub:#7a6f62; --accent:#8a4b2a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.4rem;margin:8px 0 4px}
  .lead{color:var(--sub);font-size:.9rem;margin:0 0 16px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
  .bar label{display:flex;flex-direction:column;font-size:.75rem;color:var(--sub);flex:1;min-width:200px}
  input,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:#fff;border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;width:100%}
  textarea{resize:vertical}
  details{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  summary{cursor:pointer;font-size:.9rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
  .card .q{font-size:.8rem;color:var(--accent);font-weight:700;margin-bottom:6px}
  .card input{margin-bottom:5px}
  .card input:last-child{margin-bottom:0}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 10px;align-items:center}
  button{font:inherit;font-size:.95rem;cursor:pointer;border-radius:8px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;padding:9px 18px}
  button.ghost{background:transparent;color:var(--accent)}
  .note{font-size:.8rem;color:var(--sub)}
  #preview{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff;border-radius:6px}
  h2{font-size:1.05rem;margin:28px 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>30の短篇</h1>
  <p class="lead">30のお題に短篇を当てはめて、一枚の画像にします。項目は全部埋めなくてもいい感じになるはずです。入力内容はこのブラウザの中だけで処理され、サーバーには送信されません。</p>

  <div class="bar">
    <label>シートのタイトル<input id="sheetTitle" value="30の短篇"></label>
    <label>名前（任意）<input id="sheetName" placeholder="例：@name"></label>
  </div>

  <details>
    <summary>表計算ソフトからまとめて貼り付ける</summary>
    <p class="note">1行が1つのお題（上から順に01〜30）。「作品名［Tab］作家名」の形で貼ってください。空行は空欄になります。</p>
    <textarea id="bulk" rows="6" placeholder="作品名&#9;作家名"></textarea>
    <div class="actions"><button class="ghost" id="bulkApply" type="button">この内容を反映する</button></div>
  </details>

  <div class="grid" id="grid"></div>

  <div class="actions">
    <button id="save" type="button">PNGを保存</button>
    <button class="ghost" id="clear" type="button">全部消す</button>
    <span class="note">入力は自動で保存されます。</span>
  </div>

  <h2>プレビュー</h2>
  <p class="note">iPhoneなどで保存できない場合は、下の画像を長押ししてください。</p>
  <img id="preview" alt="30の短篇のプレビュー">
</div>

<script>
const PROMPTS = [
  "むかし読んで忘れられない短篇","繰り返し読む・読みたい短篇","もっと評価されるべき短篇","発想がすごい短篇","技巧がすごい短篇",
  "構造がすごい短篇","笑える短篇","こわい短篇","切ない短篇","ずっしりと重い短篇",
  "美しい短篇","渋い・恰好いい短篇","食べものについての短篇","音楽についての短篇","愛についての短篇",
  "変・実験的な短篇","掌篇","中篇","郷愁","神話",
  "夢・幻想","古典","準古典","現代","人物が印象的",
  "文章が印象的","幕切れが印象的","好きな作家のこの一作","好きなシリーズ・連作からひとつ","人には薦められないけど好き"
];
const COLS = 3, ROWS = 10;
const KEY = "tanpen30:v1";
const FONT = '"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif';

let state = load();

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.items)) {
      // 旧データにあった所収(c)は読み込まず捨てる
      s.items = s.items.slice(0,30).map(it=>({t:(it&&it.t)||"", a:(it&&it.a)||""}));
      while(s.items.length < 30) s.items.push({t:"",a:""});
      return s;
    }
  }catch(e){}
  return {title:"30の短篇", name:"", items:PROMPTS.map(()=>({t:"",a:""}))};
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

// ---- 入力UI ----
const grid = document.getElementById("grid");
PROMPTS.forEach((p,i)=>{
  const card = document.createElement("div");
  card.className = "card";
  const n = String(i+1).padStart(2,"0");
  card.innerHTML = `<div class="q">${n}．${p}</div>
    <input data-i="${i}" data-k="t" placeholder="作品名" autocomplete="off">
    <input data-i="${i}" data-k="a" placeholder="作家名" autocomplete="off">`;
  grid.appendChild(card);
});
function fillInputs(){
  document.getElementById("sheetTitle").value = state.title ?? "";
  document.getElementById("sheetName").value = state.name ?? "";
  grid.querySelectorAll("input").forEach(el=>{
    el.value = state.items[el.dataset.i][el.dataset.k] || "";
  });
}
fillInputs();

grid.addEventListener("input", e=>{
  const el = e.target;
  if(!el.dataset.k) return;
  state.items[el.dataset.i][el.dataset.k] = el.value;
  changed();
});
document.getElementById("sheetTitle").addEventListener("input", e=>{ state.title = e.target.value; changed(); });
document.getElementById("sheetName").addEventListener("input", e=>{ state.name = e.target.value; changed(); });

document.getElementById("bulkApply").addEventListener("click", ()=>{
  const lines = document.getElementById("bulk").value.replace(/\r/g,"").split("\n");
  lines.slice(0,30).forEach((line,i)=>{
    const f = line.split("\t");
    state.items[i] = {t:(f[0]||"").trim(), a:(f[1]||"").trim()};
  });
  fillInputs(); changed();
});
document.getElementById("clear").addEventListener("click", ()=>{
  if(!confirm("入力した内容をすべて消します。よろしいですか？")) return;
  state.items = PROMPTS.map(()=>({t:"",a:""}));
  state.title = "30の短篇"; state.name = "";
  document.getElementById("bulk").value = "";
  fillInputs(); changed();
});

let timer;
function changed(){ persist(); clearTimeout(timer); timer = setTimeout(render, 300); }

// ---- 描画 ----
function wrap(ctx, text, maxW){
  const NO_HEAD = "、。，．,.）)」』】〕］｝〉》！？!?…ー・：；ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ";
  const out = [];
  String(text||"").split("\n").forEach(par=>{
    if(par === ""){ out.push(""); return; }
    let line = "";
    for(const ch of par){
      if(ctx.measureText(line + ch).width > maxW && line !== "" && !NO_HEAD.includes(ch)){
        out.push(line); line = ch;
      }else{
        line += ch;
      }
    }
    out.push(line);
  });
  return out;
}

const W = 1200, M = 40, PAD = 14, SC = 2;
const COLW = (W - M*2) / COLS;
const S = {
  label:{f:`700 13px ${FONT}`, lh:19, color:"#8a4b2a"},
  title:{f:`700 20px ${FONT}`, lh:28, color:"#2a2622"},
  author:{f:`400 16px ${FONT}`, lh:24, color:"#4a443d"},
};

function buildCell(ctx, i){
  const it = state.items[i];
  const maxW = COLW - PAD*2;
  const blocks = [];
  const push = (style, text, gapBefore)=>{
    ctx.font = S[style].f;
    const lines = wrap(ctx, text, maxW);
    blocks.push({style, lines, gap:gapBefore||0});
  };
  push("label", String(i+1).padStart(2,"0") + "　" + PROMPTS[i]);
  if(it.t.trim()) push("title", it.t.trim(), 6);
  if(it.a.trim()) push("author", it.a.trim(), 4);
  let h = PAD*2;
  blocks.forEach(b=>{ h += b.gap + b.lines.length * S[b.style].lh; });
  return {blocks, h};
}

async function render(){
  try{
    await Promise.all([
      document.fonts.load(`400 16px "Noto Serif JP"`, "あ漢"),
      document.fonts.load(`700 16px "Noto Serif JP"`, "あ漢"),
    ]);
  }catch(e){}
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.textBaseline = "top";

  const cells = PROMPTS.map((_,i)=>buildCell(ctx, i));
  const rowH = [];
  for(let r=0;r<ROWS;r++){
    let h = 84;
    for(let c=0;c<COLS;c++) h = Math.max(h, cells[r*COLS+c].h);
    rowH.push(h);
  }
  const HEAD = 96, FOOT = 36;
  const gridH = rowH.reduce((a,b)=>a+b,0);
  const H = Math.ceil(HEAD + gridH + FOOT + M);

  canvas.width = W*SC; canvas.height = H*SC;
  ctx.scale(SC, SC);
  ctx.textBaseline = "top";

  // 背景
  ctx.fillStyle = "#fbf8f2"; ctx.fillRect(0,0,W,H);

  // ヘッダー
  ctx.fillStyle = "#2a2622";
  ctx.font = `700 34px ${FONT}`;
  ctx.textAlign = "left";
  ctx.fillText(state.title || "", M, 34);
  if(state.name){
    ctx.font = `400 16px ${FONT}`; ctx.fillStyle = "#7a6f62";
    ctx.textAlign = "right";
    ctx.fillText(state.name, W-M, 52);
    ctx.textAlign = "left";
  }

  // 罫線と枠
  const top = HEAD;
  ctx.strokeStyle = "#cbbfae"; ctx.lineWidth = 1;
  ctx.strokeRect(M+.5, top+.5, W-M*2, gridH);
  let y = top;
  for(let r=0;r<ROWS;r++){
    if(r>0){ ctx.beginPath(); ctx.moveTo(M, y+.5); ctx.lineTo(W-M, y+.5); ctx.stroke(); }
    y += rowH[r];
  }
  for(let c=1;c<COLS;c++){
    const x = M + COLW*c;
    ctx.beginPath(); ctx.moveTo(x+.5, top); ctx.lineTo(x+.5, top+gridH); ctx.stroke();
  }

  // セル本文
  y = top;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cell = cells[r*COLS+c];
      let cy = y + PAD;
      const cx = M + COLW*c + PAD;
      cell.blocks.forEach(b=>{
        cy += b.gap;
        ctx.font = S[b.style].f; ctx.fillStyle = S[b.style].color;
        b.lines.forEach(line=>{ ctx.fillText(line, cx, cy + (S[b.style].lh - parseInt(S[b.style].f.match(/(\d+)px/)[1]))/2); cy += S[b.style].lh; });
      });
    }
    y += rowH[r];
  }

  const img = document.getElementById("preview");
  img.src = canvas.toDataURL("image/png");
  render.canvas = canvas;
}

document.getElementById("save").addEventListener("click", async ()=>{
  await render();
  const canvas = render.canvas;
  canvas.toBlob(blob=>{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tanpen30.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  }, "image/png");
});

render();
</script>
</body>
</html>
